<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Savenow study</title>
<!--
  One link for everyone (open to all, e.g. for grading). Each visit is a fresh 50/50 coin flip between version A and B, with no cap and no sign-in.

  Link:        https://<your-site>/ab.html
  Pick one:    ab.html?force=A   ab.html?force=B
-->
<script>
  // Edit these if your Netlify site name differs. ?study=1 switches on the in-app tasks and result logging.
  var SITE = {
    A: 'https://gregarious-taffy-eea441.netlify.app/?study=1#home',
    B: 'https://design-b--gregarious-taffy-eea441.netlify.app/?study=1#home'
  };
  (function () {
    var forced = new URLSearchParams(location.search).get('force');
    var a = new Uint8Array(1); crypto.getRandomValues(a);
    var variant = forced === 'A' || forced === 'B' ? forced : (a[0] % 2 ? 'B' : 'A');
    location.replace(SITE[variant]);
  })();
</script>
</head>
<body style="font: 16px -apple-system, system-ui, sans-serif; padding: 24px">Loading your study…</body>
</html>
