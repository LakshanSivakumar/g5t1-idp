<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover lets the layout run under the notch / Dynamic Island; safe areas are handled in css/base.css -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Savenow</title>
  <meta name="description" content="Savenow — Finance made easy. Stay within your daily budget and keep your streak.">

  <!-- Standalone / Add to Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Savenow">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#F2F2F7">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">

  <!-- Design tokens (from Savenow-High-Fidelity-Color-Palette.html) and shared styles -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">

  <!-- Screen styles -->
  <link rel="stylesheet" href="src/screens/onboarding/onboarding.css">
  <link rel="stylesheet" href="src/screens/auth/auth.css">
  <link rel="stylesheet" href="src/screens/setup-banks/setup-banks.css">
  <link rel="stylesheet" href="src/screens/setup-goal/setup-goal.css">
  <link rel="stylesheet" href="src/screens/setup-recurring/setup-recurring.css">
  <link rel="stylesheet" href="src/screens/setup-socials/setup-socials.css">
  <link rel="stylesheet" href="src/screens/home/home.css">
  <link rel="stylesheet" href="src/screens/add/add.css">
  <link rel="stylesheet" href="src/screens/edit-expense/edit-expense.css">
  <link rel="stylesheet" href="src/screens/insights/insights.css">
  <link rel="stylesheet" href="src/screens/categories/categories.css">
  <link rel="stylesheet" href="src/screens/timeline/timeline.css">
  <link rel="stylesheet" href="src/screens/recovery/recovery.css">
  <link rel="stylesheet" href="src/screens/social/social.css">
  <link rel="stylesheet" href="src/screens/settings/settings.css">
  <link rel="stylesheet" href="src/screens/lock/lock.css">
</head>
<body>
  <div id="app">
    <!-- Decorative device chrome, shown only when simulating a phone in desktop Chrome -->
    <div class="statusbar-sim" aria-hidden="true">
      <span>9:41</span>
      <span class="sb-right">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 4.3a9.5 9.5 0 0 1 13 0M4 7a6 6 0 0 1 8 0"/><circle cx="8" cy="10" r="1.2" fill="currentColor" stroke="none"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="18" height="9" rx="2.2" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.5-1.1 1.5-2s-.7-1.7-1.5-2z" fill="currentColor" opacity=".5"/></svg>
      </span>
    </div>

    <!-- Screens are mounted here by App.router -->
    <div id="screens"></div>

    <!-- UITabBar -->
    <nav class="tabbar" id="tabbar" aria-label="Main">
      <button class="tab" data-tab="home" id="tab-home"><span class="ico" data-icon="house.fill"></span><span>Home</span></button>
      <button class="tab" data-tab="insights" id="tab-insights"><span class="ico" data-icon="chart.pie.fill"></span><span>Insights</span></button>
      <button class="tab tab-add" id="tab-add" aria-haspopup="dialog"><span class="ico" data-icon="plus.circle.fill"></span><span>Add</span></button>
      <button class="tab" data-tab="social" id="tab-social"><span class="ico" data-icon="person.2.fill"></span><span>Social</span></button>
      <button class="tab" data-tab="settings" id="tab-settings"><span class="ico" data-icon="gearshape.fill"></span><span>Settings</span></button>
    </nav>

    <div class="scrim" id="scrim"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="home-indicator-sim" aria-hidden="true"></div>
  </div>

  <!-- Core -->
  <script src="src/core/icons.js"></script>
  <script src="src/core/state.js"></script>
  <script src="src/core/ui.js"></script>
  <script src="src/core/router.js"></script>
  <script src="src/core/maze.js"></script>

  <!-- Screens (each file registers itself; order = mount order) -->
  <script src="src/screens/onboarding/onboarding.js"></script>
  <script src="src/screens/auth/auth.js"></script>
  <script src="src/screens/setup-banks/setup-banks.js"></script>
  <script src="src/screens/setup-goal/setup-goal.js"></script>
  <script src="src/screens/setup-recurring/setup-recurring.js"></script>
  <script src="src/screens/setup-socials/setup-socials.js"></script>
  <script src="src/screens/home/home.js"></script>
  <script src="src/screens/add/add.js"></script>
  <script src="src/screens/edit-expense/edit-expense.js"></script>
  <script src="src/screens/insights/insights.js"></script>
  <script src="src/screens/categories/categories.js"></script>
  <script src="src/screens/timeline/timeline.js"></script>
  <script src="src/screens/recovery/recovery.js"></script>
  <script src="src/screens/social/social.js"></script>
  <script src="src/screens/settings/settings.js"></script>
  <script src="src/screens/lock/lock.js"></script>

  <script src="src/main.js"></script>
  <script>
    // Fill tab bar glyphs from the icon registry
    document.querySelectorAll('#tabbar [data-icon]').forEach(function (el) {
      el.outerHTML = App.icon(el.getAttribute('data-icon'), 25);
    });
  </script>
</body>
</html>
